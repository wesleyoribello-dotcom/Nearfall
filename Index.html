<!DOCTYPE html>
<html>
<body style="background:black;color:white;text-align:center;font-family:Arial">

<h1>NEARFALL</h1>

<p>Game is live 🔥</p>

<button onclick="start()">Start Career</button>

<script>
function start(){
document.body.innerHTML = `
<h1>Season Started</h1>
<button onclick="match()">Start Match</button>
`
}

function match(){
let score = 0

document.body.innerHTML = `
<h1>Match</h1>
<p id="score">0</p>
<button onclick="score()">Score</button>
<button onclick="finish()">Finish</button>
`

window.score = function(){
score += 2
document.getElementById("score").innerText = score
}

window.finish = function(){
document.body.innerHTML = "<h1>Done</h1><button onclick='location.reload()'>Restart</button>"
}
}
</script>

</body>
</html>
