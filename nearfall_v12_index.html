<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nearfall v12</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071126;
      color: #fff;
      padding: 16px;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 { text-align: center; margin: 8px 0 18px; font-size: 34px; }
    h2, h3, p { margin: 8px 0; }
    .card {
      background: #0d1a36;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.2);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 760px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      background: #2d6fdd;
      color: white;
      font-size: 18px;
      font-weight: 700;
    }
    .row button { flex: 1 1 180px; }
    .secondary { background: #334260; }
    .danger { background: #7f1d1d; }
    .smallbtn {
      width: 48px;
      padding: 10px 0;
      margin: 0;
      font-size: 16px;
    }
    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #314260;
      background: #091225;
      color: white;
      margin-top: 10px;
      font-size: 16px;
    }
    .pill {
      display: inline-block;
      background: #243454;
      color: #dbe6ff;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      margin-right: 6px;
      margin-top: 6px;
    }
    .muted { color: #b8c6e6; }
    .score { font-size: 28px; font-weight: 800; text-align: center; margin: 14px 0; }
    .small { font-size: 14px; color: #bed0ff; }
    .stat {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #213253;
      padding: 8px 0;
    }
    .stat:last-child { border-bottom: none; }
    .statline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #213253;
    }
    .statline:last-child { border-bottom: none; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      text-align: left;
      padding: 8px 4px;
      border-bottom: 1px solid #213253;
      font-size: 14px;
    }
    .center { text-align: center; }
    .good { color: #8ef58e; }
    .bad { color: #ff9f9f; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>NEARFALL v12</h1>
  <div id="app"></div>
</div>

<script>
(() => {
  const app = document.getElementById("app");

  const teams = ["Iowa","Penn State","Oklahoma State","Ohio State","Texas"];
  const heights = ["5-4","5-5","5-6","5-7","5-8","5-9","5-10","5-11","6-0","6-1","6-2","6-3","6-4"];
  const weights = ["125","133","141","149","157","165","174","184","197","285"];
  const styles = ["Powerhouse","Technician","Scrambler"];
  const firstNames = ["Jace","Ty","Evan","Cole","Mason","Logan","Luke","Noah","Blake","Ryder","Parker","Grant","Caleb","Dylan","Brady","Zane","Aiden","Brock","Gavin","Wyatt"];
  const lastNames = ["Miller","Harris","Taylor","Young","Porter","Hayes","Woods","Keller","Stone","Cooper","Bennett","Foster","Reed","Perry","Ward","Lawson","Carter","Palmer","Morgan","Russell"];

  const state = {
    player: null,
    pointsLeft: 20,
    week: 1,
    schedule: [],
    currentOpponent: null,
    teamDual: null,
    scoreYou: 0,
    scoreOpp: 0,
    season: 1,
    conference: null,
    ncaa: null
  };

  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr) { return arr[rand(0, arr.length - 1)]; }
  function randomName() { return pick(firstNames) + " " + pick(lastNames); }
  function setApp(html) { app.innerHTML = html; }
  function bind(id, fn) { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function resetPlayerDefaults() {
    state.player = {
      name: "Wrestler",
      team: "",
      weight: "157",
      height: "5-10",
      age: 18,
      classYear: "Freshman",
      style: "",
      rank: 25,
      stars: 3,
      offense: 60,
      defense: 60,
      top: 60,
      bottom: 60,
      strength: 60,
      wins: 0,
      losses: 0,
      teamWins: 0,
      teamLosses: 0,
      allAmerican: false,
      ncaaFinish: ""
    };
    state.pointsLeft = 20;
    state.week = 1;
    state.schedule = [];
    state.currentOpponent = null;
    state.teamDual = null;
    state.scoreYou = 0;
    state.scoreOpp = 0;
    state.season = 1;
    state.conference = null;
    state.ncaa = null;
  }

  function playerProfileCard() {
    const p = state.player;
    return `
      <div class="card">
        <h2>Player Profile</h2>
        <div class="pill">${p.team}</div>
        <div class="pill">${p.classYear}</div>
        <div class="pill">${p.weight}</div>
        <div class="pill">${p.style}</div>
        <p><strong>${p.name}</strong></p>
        <p class="muted">Age ${p.age} • Height ${p.height} • ${p.stars}★ recruit</p>
        <p class="muted">Rank #${p.rank} • Record ${p.wins}-${p.losses}</p>
        <div class="stat"><span>Offense</span><strong>${p.offense}</strong></div>
        <div class="stat"><span>Defense</span><strong>${p.defense}</strong></div>
        <div class="stat"><span>Top</span><strong>${p.top}</strong></div>
        <div class="stat"><span>Bottom</span><strong>${p.bottom}</strong></div>
        <div class="stat"><span>Strength</span><strong>${p.strength}</strong></div>
      </div>
    `;
  }

  function teamInfoCard() {
    const p = state.player;
    return `
      <div class="card">
        <h2>Team Info</h2>
        <p><strong>${p.team}</strong></p>
        <p class="muted">Season ${state.season} • Week ${state.week}</p>
        <p class="muted">Dual Record: ${p.teamWins}-${p.teamLosses}</p>
        <p class="muted">${p.allAmerican ? "All-American" : "Not All-American yet"}</p>
      </div>
    `;
  }

  function opponentCard() {
    const o = state.currentOpponent;
    if (!o) return "";
    return `
      <div class="card">
        <h2>Opponent Info</h2>
        <div class="pill">${o.school}</div>
        <div class="pill">${o.year}</div>
        <div class="pill">${o.weight}</div>
        <div class="pill">${o.style}</div>
        <p><strong>${o.name}</strong></p>
        <p class="muted">Rank #${o.rank}</p>
        <div class="stat"><span>Offense</span><strong>${o.offense}</strong></div>
        <div class="stat"><span>Defense</span><strong>${o.defense}</strong></div>
        <div class="stat"><span>Top</span><strong>${o.top}</strong></div>
        <div class="stat"><span>Bottom</span><strong>${o.bottom}</strong></div>
        <div class="stat"><span>Strength</span><strong>${o.strength}</strong></div>
      </div>
    `;
  }

  function renderHome() {
    resetPlayerDefaults();
    setApp(`
      <div class="card">
        <h2>Create Your Wrestler</h2>
        <p class="muted">Pick team, style, height, weight, and build your stats.</p>
        <input id="playerName" value="${state.player.name}" />
        <div class="row">
          ${teams.map((team, i) => `<button id="team-${i}">${team}</button>`).join("")}
        </div>
      </div>
    `);
    teams.forEach((team, i) => bind(`team-${i}`, () => renderStyle(team)));
  }

  function renderStyle(team) {
    state.player.name = document.getElementById("playerName").value || "Wrestler";
    state.player.team = team;
    setApp(`
      <div class="card">
        <h2>${state.player.name}</h2>
        <div class="pill">${team}</div>
        <p class="muted">Pick a style.</p>
        <div class="row">
          ${styles.map((style, i) => `<button id="style-${i}">${style}</button>`).join("")}
          <button id="back-home" class="secondary">Back</button>
        </div>
      </div>
    `);
    styles.forEach((style, i) => bind(`style-${i}`, () => pickStyle(style)));
    bind("back-home", renderHome);
  }

  function pickStyle(style) {
    state.player.style = style;
    state.player.offense = 60;
    state.player.defense = 60;
    state.player.top = 60;
    state.player.bottom = 60;
    state.player.strength = 60;
    state.pointsLeft = 20;

    if (style === "Powerhouse") {
      state.player.strength += 8;
      state.player.top += 4;
    }
    if (style === "Technician") {
      state.player.offense += 6;
      state.player.defense += 6;
    }
    if (style === "Scrambler") {
      state.player.bottom += 8;
      state.player.offense += 3;
    }

    renderBuilder();
  }

  function statRow(key, label, value) {
    return `
      <div class="statline">
        <div>${label}: <strong>${value}</strong></div>
        <div class="row" style="margin-top:0;">
          <button id="minus-${key}" class="smallbtn secondary">-</button>
          <button id="plus-${key}" class="smallbtn">+</button>
        </div>
      </div>
    `;
  }

  function renderBuilder() {
    const p = state.player;
    setApp(`
      <div class="card">
        <h2>Build Wrestler</h2>
        <div class="pill">${p.team}</div>
        <div class="pill">${p.style}</div>
        <input id="nameInput" value="${p.name}" />
        <p><strong>Height</strong></p>
        <select id="heightSel">${heights.map(h => `<option ${p.height===h?"selected":""}>${h}</option>`).join("")}</select>
        <p><strong>Weight</strong></p>
        <select id="weightSel">${weights.map(w => `<option ${p.weight===w?"selected":""}>${w}</option>`).join("")}</select>
        <p><strong>Attribute Points Left: ${state.pointsLeft}</strong></p>
        ${statRow("offense","Offense",p.offense)}
        ${statRow("defense","Defense",p.defense)}
        ${statRow("top","Top",p.top)}
        ${statRow("bottom","Bottom",p.bottom)}
        ${statRow("strength","Strength",p.strength)}
        <div class="row">
          <button id="start-career">Start Career</button>
          <button id="back-style" class="secondary">Back</button>
        </div>
      </div>
    `);

    ["offense","defense","top","bottom","strength"].forEach(stat => {
      bind(`minus-${stat}`, () => {
        if (state.player[stat] <= 45) return;
        state.player[stat] -= 1;
        state.pointsLeft += 1;
        renderBuilder();
      });
      bind(`plus-${stat}`, () => {
        if (state.pointsLeft <= 0) return;
        if (state.player[stat] >= 99) return;
        state.player[stat] += 1;
        state.pointsLeft -= 1;
        renderBuilder();
      });
    });

    bind("start-career", () => {
      state.player.name = document.getElementById("nameInput").value || "Wrestler";
      state.player.height = document.getElementById("heightSel").value;
      state.player.weight = document.getElementById("weightSel").value;
      buildSchedule();
      renderSeasonHub();
    });
    bind("back-style", () => renderStyle(state.player.team));
  }

  function buildSchedule() {
    state.schedule = teams.filter(t => t !== state.player.team).map((team, i) => ({
      week: i + 1,
      opponentTeam: team
    }));
  }

  function renderSeasonHub() {
    setApp(`
      <div class="grid">
        ${playerProfileCard()}
        ${teamInfoCard()}
      </div>

      <div class="card">
        <h2>Regular Season Schedule</h2>
        <table>
          <thead><tr><th>Week</th><th>Dual</th><th>Status</th></tr></thead>
          <tbody>
            ${state.schedule.map(g => `
              <tr>
                <td>${g.week}</td>
                <td>${state.player.team} vs ${g.opponentTeam}</td>
                <td>${g.week === state.week ? "Next" : (g.week < state.week ? "Done" : "Upcoming")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        <div class="row">
          <button id="nextMatchBtn">Next Match</button>
          <button id="simBtn" class="secondary">Sim to Tournament</button>
        </div>
      </div>
    `);
    bind("nextMatchBtn", startMatch);
    bind("simBtn", () => {
      state.week = state.schedule.length + 1;
      renderConferenceIntro();
    });
  }

  function makeOpponent(team, boost = 0) {
    return {
      name: randomName(),
      school: team,
      weight: state.player.weight,
      rank: rand(Math.max(1,8-boost), 30),
      year: pick(["Fr","So","Jr","Sr"]),
      style: pick(["Power","Scrambler","Technician","Rider"]),
      offense: rand(60 + boost, 82 + boost),
      defense: rand(60 + boost, 82 + boost),
      top: rand(60 + boost, 82 + boost),
      bottom: rand(60 + boost, 82 + boost),
      strength: rand(60 + boost, 82 + boost)
    };
  }

  function simulateDual(opponentTeam) {
    return {
      yourTeam: state.player.team,
      oppTeam: opponentTeam,
      yourTeamScore: 12 + rand(6, 14),
      oppTeamScore: 12 + rand(6, 14)
    };
  }

  function startMatch() {
    const game = state.schedule.find(g => g.week === state.week);
    if (!game) {
      renderConferenceIntro();
      return;
    }
    state.currentOpponent = makeOpponent(game.opponentTeam);
    state.teamDual = simulateDual(game.opponentTeam);
    state.scoreYou = 0;
    state.scoreOpp = 0;
    renderMatchScreen("Dual meet started. Your result adds team points.");
  }

  function renderMatchScreen(message) {
    const t = state.teamDual;
    setApp(`
      <div class="grid">
        ${playerProfileCard()}
        ${opponentCard()}
      </div>

      <div class="card">
        <h2>Dual Meet</h2>
        <p><strong>${t.yourTeam} vs ${t.oppTeam}</strong></p>
        <p class="muted">Team Score Before Your Match: ${t.yourTeam} ${t.yourTeamScore} - ${t.oppTeamScore} ${t.oppTeam}</p>
      </div>

      <div class="card">
        <h2>Your Match</h2>
        <div class="score">You ${state.scoreYou} - ${state.scoreOpp} Opp</div>
        <p class="small">${message}</p>
        <div class="row">
          <button id="attackBtn">Attack</button>
          <button id="escapeBtn">Escape</button>
          <button id="restBtn" class="secondary">Rest</button>
        </div>
      </div>
    `);
    bind("attackBtn", attack);
    bind("escapeBtn", escapeMove);
    bind("restBtn", restMove);
  }

  function oppResponse() {
    const o = state.currentOpponent;
    const attackRoll = o.offense + rand(-8, 8);
    const defenseRoll = state.player.defense + rand(-8, 8);
    if (attackRoll > defenseRoll + 6) state.scoreOpp += 3;
    else if (rand(1, 100) < 25) state.scoreOpp += 1;
  }

  function checkTech() {
    if (state.scoreYou - state.scoreOpp >= 15) { finishMatch(true, "Technical Fall"); return true; }
    if (state.scoreOpp - state.scoreYou >= 15) { finishMatch(false, "Technical Fall"); return true; }
    return false;
  }

  function attack() {
    const p = state.player;
    const o = state.currentOpponent;
    const yourRoll = p.offense + Math.floor(p.strength / 5) + rand(-8, 8);
    const oppRoll = o.defense + rand(-8, 8);
    if (yourRoll > oppRoll + 5) state.scoreYou += 3;
    else if (yourRoll > oppRoll) state.scoreYou += 1;
    oppResponse();
    if (!checkTech()) renderMatchScreen("You attacked. Matchups are driven by your stats vs opponent stats.");
  }

  function escapeMove() {
    const p = state.player;
    const o = state.currentOpponent;
    const yourRoll = p.bottom + rand(-8, 8);
    const oppRoll = o.top + rand(-8, 8);
    if (yourRoll > oppRoll) state.scoreYou += 1;
    oppResponse();
    if (!checkTech()) renderMatchScreen("You worked for an escape while the opponent looked to score back.");
  }

  function restMove() {
    oppResponse();
    if (!checkTech()) renderMatchScreen("You slowed the pace. Opponent still had chances to score.");
  }

  function finishMatch(win, resultType) {
    const dual = state.teamDual;
    let teamPtsForYou = 0;
    const margin = state.scoreYou - state.scoreOpp;
    const loseMargin = state.scoreOpp - state.scoreYou;

    if (win) {
      state.player.wins += 1;
      state.player.rank = Math.max(1, state.player.rank - 1);
      if (resultType === "Technical Fall") teamPtsForYou = 5;
      else if (margin >= 8) teamPtsForYou = 4;
      else teamPtsForYou = 3;
      dual.yourTeamScore += teamPtsForYou;
    } else {
      state.player.losses += 1;
      state.player.rank += 1;
      if (resultType === "Technical Fall") dual.oppTeamScore += 5;
      else if (loseMargin >= 8) dual.oppTeamScore += 4;
      else dual.oppTeamScore += 3;
    }

    if (dual.yourTeamScore > dual.oppTeamScore) state.player.teamWins += 1;
    else state.player.teamLosses += 1;

    setApp(`
      <div class="grid">
        ${playerProfileCard()}
        ${opponentCard()}
      </div>

      <div class="card">
        <h2>${win ? "You Won" : "You Lost"}</h2>
        <p>Result: <strong>${resultType}</strong></p>
        <p>Final Match Score: You ${state.scoreYou} - ${state.scoreOpp} Opp</p>
        <p>Your bout gave ${state.player.team} <strong>${teamPtsForYou}</strong> team points.</p>
      </div>

      <div class="card">
        <h2>Dual Result</h2>
        <p><strong>${dual.yourTeam} ${dual.yourTeamScore} - ${dual.oppTeamScore} ${dual.oppTeam}</strong></p>
        <div class="row">
          <button id="continueBtn">Continue</button>
        </div>
      </div>
    `);
    bind("continueBtn", () => {
      state.week += 1;
      if (state.week > state.schedule.length) renderConferenceIntro();
      else renderSeasonHub();
    });
  }

  function renderConferenceIntro() {
    state.conference = { round: 1, name: "Quarterfinal", seed: Math.max(1, Math.min(8, Math.ceil(state.player.rank / 4))) };
    setApp(`
      <div class="grid">
        ${playerProfileCard()}
        ${teamInfoCard()}
      </div>
      <div class="card center">
        <h2>Conference Tournament</h2>
        <p>Seed: #${state.conference.seed}</p>
        <p>Rounds: Quarterfinal, Semifinal, Final</p>
        <div class="row">
          <button id="startConfBtn">Start Conference Tournament</button>
        </div>
      </div>
    `);
    bind("startConfBtn", startConferenceRound);
  }

  function startConferenceRound() {
    const names = {1: "Quarterfinal", 2: "Semifinal", 3: "Final"};
    state.conference.name = names[state.conference.round];
    state.currentOpponent = makeOpponent(pick(teams.filter(t => t !== state.player.team)), state.conference.round * 2);
    state.scoreYou = 0;
    state.scoreOpp = 0;
    renderBracketMatch("Conference Tournament - " + state.conference.name, "Win and advance. Lose and conference tournament ends.");
  }

  function renderNcaaIntro() {
    state.ncaa = { round: 1, name: "Round of 32", seed: Math.max(1, Math.min(32, state.player.rank)) };
    setApp(`
      <div class="grid">
        ${playerProfileCard()}
        ${teamInfoCard()}
      </div>
      <div class="card center">
        <h2>NCAA Tournament</h2>
        <p>Seed: #${state.ncaa.seed}</p>
        <p>Rounds: Round of 32, Round of 16, Quarterfinal, Semifinal, Final</p>
        <div class="row">
          <button id="startNcaaBtn">Start NCAA Tournament</button>
        </div>
      </div>
    `);
    bind("startNcaaBtn", startNcaaRound);
  }

  function startNcaaRound() {
    const names = {1: "Round of 32", 2: "Round of 16", 3: "Quarterfinal", 4: "Semifinal", 5: "Final"};
    state.ncaa.name = names[state.ncaa.round];
    state.currentOpponent = makeOpponent(pick(teams), state.ncaa.round * 3);
    state.scoreYou = 0;
    state.scoreOpp = 0;
    renderBracketMatch("NCAA Tournament - " + state.ncaa.name, "Win and advance. Lose and your NCAA run ends.");
  }

  function renderBracketMatch(title, message) {
    setApp(`
      <div class="grid">
        ${playerProfileCard()}
        ${opponentCard()}
      </div>

      <div class="card">
        <h2>${title}</h2>
        <div class="score">You ${state.scoreYou} - ${state.scoreOpp} Opp</div>
        <p class="small">${message}</p>
        <div class="row">
          <button id="attackBtn">Attack</button>
          <button id="escapeBtn">Escape</button>
          <button id="restBtn" class="secondary">Rest</button>
        </div>
      </div>
    `);
    bind("attackBtn", bracketAttack);
    bind("escapeBtn", bracketEscape);
    bind("restBtn", bracketRest);
  }

  function bracketOppResponse() {
    const o = state.currentOpponent;
    const attackRoll = o.offense + rand(-8, 8);
    const defenseRoll = state.player.defense + rand(-8, 8);
    if (attackRoll > defenseRoll + 6) state.scoreOpp += 3;
    else if (rand(1, 100) < 25) state.scoreOpp += 1;
  }

  function checkBracketTech(finishFn) {
    if (state.scoreYou - state.scoreOpp >= 15) { finishFn(true, "Technical Fall"); return true; }
    if (state.scoreOpp - state.scoreYou >= 15) { finishFn(false, "Technical Fall"); return true; }
    return false;
  }

  function bracketAttack() {
    const p = state.player;
    const o = state.currentOpponent;
    const yourRoll = p.offense + Math.floor(p.strength / 5) + rand(-8, 8);
    const oppRoll = o.defense + rand(-8, 8);
    if (yourRoll > oppRoll + 5) state.scoreYou += 3;
    else if (yourRoll > oppRoll) state.scoreYou += 1;
    bracketOppResponse();
    const finishFn = state.ncaa ? finishNcaaMatch : finishConferenceMatch;
    if (!checkBracketTech(finishFn)) renderBracketMatch(state.ncaa ? "NCAA Tournament - " + state.ncaa.name : "Conference Tournament - " + state.conference.name, "Stats are driving both sides.");
  }

  function bracketEscape() {
    const p = state.player;
    const o = state.currentOpponent;
    const yourRoll = p.bottom + rand(-8, 8);
    const oppRoll = o.top + rand(-8, 8);
    if (yourRoll > oppRoll) state.scoreYou += 1;
    bracketOppResponse();
    const finishFn = state.ncaa ? finishNcaaMatch : finishConferenceMatch;
    if (!checkBracketTech(finishFn)) renderBracketMatch(state.ncaa ? "NCAA Tournament - " + state.ncaa.name : "Conference Tournament - " + state.conference.name, "You worked for an escape.");
  }

  function bracketRest() {
    bracketOppResponse();
    const finishFn = state.ncaa ? finishNcaaMatch : finishConferenceMatch;
    if (!checkBracketTech(finishFn)) renderBracketMatch(state.ncaa ? "NCAA Tournament - " + state.ncaa.name : "Conference Tournament - " + state.conference.name, "You slowed the pace.");
  }

  function finishConferenceMatch(win, resultType) {
    let nextLabel = "";
    let nextFn = null;
    let title = win ? "Advanced" : "Eliminated";
    let extra = "";
    if (win) {
      if (state.conference.round === 3) {
        title = "Conference Champion";
        state.player.rank = Math.max(1, state.player.rank - 2);
        extra = "<p>You won your conference tournament.</p>";
        nextLabel = "Advance to NCAA Tournament";
        nextFn = renderNcaaIntro;
      } else {
        state.conference.round += 1;
        nextLabel = "Next Round";
        nextFn = startConferenceRound;
      }
    } else {
      extra = "<p>You did not win the conference, but you still qualified for nationals.</p>";
      nextLabel = "Advance to NCAA Tournament";
      nextFn = renderNcaaIntro;
    }

    if (win) state.player.wins += 1; else state.player.losses += 1;

    setApp(`
      <div class="grid">
        ${playerProfileCard()}
        ${opponentCard()}
      </div>
      <div class="card">
        <h2>${title}</h2>
        <p>Result: <strong>${resultType}</strong></p>
        <p>Final Match Score: You ${state.scoreYou} - ${state.scoreOpp} Opp</p>
        ${extra}
        <div class="row"><button id="confNext">${nextLabel}</button></div>
      </div>
    `);
    bind("confNext", nextFn);
  }

  function finishNcaaMatch(win, resultType) {
    let nextLabel = "";
    let nextFn = null;
    let title = win ? "Advanced" : "Season Over";
    let extra = "";

    if (win) {
      if (state.ncaa.round === 5) {
        title = "National Champion";
        state.player.rank = 1;
        state.player.allAmerican = true;
        state.player.ncaaFinish = "Champion";
        extra = "<p>You won the NCAA tournament.</p>";
        nextLabel = "Finish Season";
        nextFn = renderSeasonComplete;
      } else {
        if (state.ncaa.round >= 3) state.player.allAmerican = true;
        state.ncaa.round += 1;
        nextLabel = "Next Round";
        nextFn = startNcaaRound;
      }
    } else {
      if (state.ncaa.round >= 3) state.player.allAmerican = true;
      if (state.ncaa.round === 4) state.player.ncaaFinish = "3rd-4th";
      else if (state.ncaa.round === 3) state.player.ncaaFinish = "Top 8 All-American";
      else if (state.ncaa.round === 2) state.player.ncaaFinish = "Round of 16";
      else state.player.ncaaFinish = "Qualifier";
      extra = `<p>NCAA Finish: ${state.player.ncaaFinish}</p>`;
      nextLabel = "Finish Season";
      nextFn = renderSeasonComplete;
    }

    if (win) state.player.wins += 1; else state.player.losses += 1;

    setApp(`
      <div class="grid">
        ${playerProfileCard()}
        ${opponentCard()}
      </div>
      <div class="card">
        <h2>${title}</h2>
        <p>Result: <strong>${resultType}</strong></p>
        <p>Final Match Score: You ${state.scoreYou} - ${state.scoreOpp} Opp</p>
        ${extra}
        <div class="row"><button id="ncaaNext">${nextLabel}</button></div>
      </div>
    `);
    bind("ncaaNext", nextFn);
  }

  function renderSeasonComplete() {
    setApp(`
      <div class="grid">
        ${playerProfileCard()}
        ${teamInfoCard()}
      </div>
      <div class="card center">
        <h2>Season Complete</h2>
        <p>Season ${state.season} finished.</p>
        <p>Individual Record: ${state.player.wins}-${state.player.losses}</p>
        <p>Team Record: ${state.player.teamWins}-${state.player.teamLosses}</p>
        <p>Final Rank: #${state.player.rank}</p>
        <p>NCAA Finish: ${state.player.ncaaFinish || "Participant"}</p>
        <p>${state.player.allAmerican ? "All-American" : "Not All-American"}</p>
        <div class="row">
          <button id="newSeasonBtn">Next Season</button>
          <button id="restartBtn" class="secondary">New Wrestler</button>
        </div>
      </div>
    `);
    bind("newSeasonBtn", nextSeason);
    bind("restartBtn", renderHome);
  }

  function nextSeason() {
    state.season += 1;
    state.week = 1;
    state.player.age += 1;
    if (state.player.classYear === "Freshman") state.player.classYear = "Sophomore";
    else if (state.player.classYear === "Sophomore") state.player.classYear = "Junior";
    else if (state.player.classYear === "Junior") state.player.classYear = "Senior";
    state.player.wins = 0;
    state.player.losses = 0;
    state.player.teamWins = 0;
    state.player.teamLosses = 0;
    state.player.ncaaFinish = "";
    state.player.allAmerican = false;
    state.player.offense += 2;
    state.player.defense += 2;
    state.player.top += 2;
    state.player.bottom += 2;
    state.player.strength += 2;
    buildSchedule();
    renderSeasonHub();
  }

  renderHome();
})();
</script>
</body>
</html>
